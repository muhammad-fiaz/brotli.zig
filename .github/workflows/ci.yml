name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - 01_quick_compress
          - 02_custom_quality
          - 03_streaming_encode
          - 04_streaming_decode
          - 05_custom_allocator
          - 06_shared_dictionary
          - 07_large_window
          - 08_error_handling
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build
      - run: zig-out/bin/${{ matrix.example }}
